<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-labelledby="title description">
<title id="title">When is it time to act?</title><desc id="description">Instructed and self-chosen timing both lead to an action.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#a4aaa5"/></marker></defs>
<rect width="1100" height="440" rx="3" fill="#10191c"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#eceeeb"><text x="550" y="52" text-anchor="middle" font-size="19" fill="#a4aaa5">TWO SOURCES OF URGENCY</text><rect x="60" y="108" width="310" height="90" rx="4" fill="#7095db" fill-opacity=".06" stroke="#7095db" stroke-opacity=".5"/><text x="215" y="148" text-anchor="middle" font-size="23" fill="#eceeeb">An instruction</text><text x="215" y="178" text-anchor="middle" font-size="19" fill="#a4aaa5">asks you to act quickly</text><rect x="60" y="258" width="310" height="90" rx="4" fill="#67b97a" fill-opacity=".06" stroke="#67b97a" stroke-opacity=".5"/><text x="215" y="298" text-anchor="middle" font-size="23" fill="#eceeeb">You choose</text><text x="215" y="328" text-anchor="middle" font-size="19" fill="#a4aaa5">when to act</text><path d="M380 153 C490 153 440 225 535 225" fill="none" stroke="#a4aaa5" stroke-width="2" marker-end="url(#arrow)"/><path d="M380 303 C480 303 450 235 535 235" fill="none" stroke="#a4aaa5" stroke-width="2" marker-end="url(#arrow)"/><circle cx="620" cy="230" r="70" fill="none" stroke="#d6dbd7" stroke-width="2"/><path d="M620 182 V230 L650 250" fill="none" stroke="#d6dbd7" stroke-width="3"/><text x="620" y="338" text-anchor="middle" font-size="23" fill="#eceeeb">Deciding when</text><path d="M705 230 H825" fill="none" stroke="#a4aaa5" stroke-width="2" marker-end="url(#arrow)"/><rect x="845" y="183" width="200" height="95" rx="4" fill="#d6dbd7" fill-opacity=".06" stroke="#d6dbd7" stroke-opacity=".5"/><text x="945" y="237" text-anchor="middle" font-size="23" fill="#eceeeb">ACT</text><text x="550" y="90" text-anchor="middle" font-size="23" fill="#eceeeb">What changes in the brain before the movement?</text></g>
</svg>
