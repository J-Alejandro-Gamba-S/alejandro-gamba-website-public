<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-labelledby="title description">
<title id="title">Following an illusion through time</title><desc id="description">A schematic EEG cap and stages of seeing, remembering, and reporting motion.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#a4aaa5"/></marker></defs>
<rect width="1100" height="440" rx="3" fill="#10191c"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#eceeeb"><text x="550" y="32" text-anchor="middle" font-size="20" fill="#a4aaa5">FOLLOWING AN ILLUSION THROUGH TIME</text><ellipse cx="550" cy="145" rx="102" ry="83" fill="none" stroke="#7095db" stroke-width="2"/><path d="M535 63 L550 45 L565 63" fill="none" stroke="#7095db" stroke-width="2"/><circle cx="500" cy="99" r="6" fill="#7095db" opacity=".65"/><circle cx="550" cy="90" r="6" fill="#7095db" opacity=".65"/><circle cx="600" cy="99" r="6" fill="#7095db" opacity=".65"/><circle cx="480" cy="143" r="6" fill="#7095db" opacity=".65"/><circle cx="520" cy="143" r="6" fill="#7095db" opacity=".65"/><circle cx="580" cy="143" r="6" fill="#7095db" opacity=".65"/><circle cx="620" cy="143" r="6" fill="#7095db" opacity=".65"/><circle cx="500" cy="185" r="6" fill="#7095db" opacity=".65"/><circle cx="550" cy="193" r="6" fill="#7095db" opacity=".65"/><circle cx="600" cy="185" r="6" fill="#7095db" opacity=".65"/><text x="264" y="123" text-anchor="middle" font-size="22" fill="#eceeeb">EEG records</text><text x="264" y="153" text-anchor="middle" font-size="20" fill="#a4aaa5">changing activity</text><text x="835" y="123" text-anchor="middle" font-size="22" fill="#eceeeb">When does</text><text x="835" y="153" text-anchor="middle" font-size="20" fill="#a4aaa5">the distortion emerge?</text><rect x="55" y="278" width="270" height="77" rx="4" fill="#67b97a" fill-opacity=".06" stroke="#67b97a" stroke-opacity=".5"/><text x="190" y="325" text-anchor="middle" font-size="23" fill="#eceeeb">See motion</text><path d="M337 317 H405" fill="none" stroke="#a4aaa5" stroke-width="2" marker-end="url(#arrow)"/><rect x="417" y="278" width="270" height="77" rx="4" fill="#7095db" fill-opacity=".06" stroke="#7095db" stroke-opacity=".5"/><text x="552" y="325" text-anchor="middle" font-size="23" fill="#eceeeb">Hold it in memory</text><path d="M699 317 H768" fill="none" stroke="#a4aaa5" stroke-width="2" marker-end="url(#arrow)"/><rect x="780" y="278" width="270" height="77" rx="4" fill="#d6dbd7" fill-opacity=".06" stroke="#d6dbd7" stroke-opacity=".5"/><text x="915" y="325" text-anchor="middle" font-size="23" fill="#eceeeb">Report a direction</text></g>
