<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-labelledby="title description">
<title id="title">Who is in control?</title><desc id="description">Physical and virtual actions can both involve a person's intention and assistance from a system.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#a4aaa5"/></marker></defs>
<rect width="1100" height="440" rx="3" fill="#10191c"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#eceeeb"><text x="550" y="47" text-anchor="middle" font-size="24" fill="#eceeeb">WHO IS IN CONTROL?</text><text x="180" y="103" text-anchor="middle" font-size="18" fill="#67b97a">YOUR GOAL</text><text x="520" y="103" text-anchor="middle" font-size="18" fill="#5fd3e6">SYSTEM ASSISTANCE</text><text x="905" y="103" text-anchor="middle" font-size="18" fill="#a4aaa5">OUTCOME</text><rect x="60" y="130" width="235" height="77" rx="4" fill="#67b97a" fill-opacity=".06" stroke="#67b97a" stroke-opacity=".5"/><text x="178" y="177" text-anchor="middle" font-size="23" fill="#eceeeb">Choose an action</text><path d="M305 168 H390" fill="none" stroke="#a4aaa5" stroke-width="2" marker-end="url(#arrow)"/><rect x="410" y="130" width="225" height="77" rx="4" fill="#5fd3e6" fill-opacity=".06" stroke="#5fd3e6" stroke-opacity=".5"/><text x="522" y="177" text-anchor="middle" font-size="23" fill="#eceeeb">Shared control</text><path d="M645 168 H760" fill="none" stroke="#a4aaa5" stroke-width="2" marker-end="url(#arrow)"/><rect x="780" y="130" width="260" height="77" rx="4" fill="#7095db" fill-opacity=".06" stroke="#7095db" stroke-opacity=".5"/><text x="910" y="163" text-anchor="middle" font-size="23" fill="#eceeeb">Physical</text><text x="910" y="188" text-anchor="middle" font-size="18" fill="#eceeeb">environment</text><rect x="60" y="265" width="235" height="77" rx="4" fill="#67b97a" fill-opacity=".06" stroke="#67b97a" stroke-opacity=".5"/><text x="178" y="312" text-anchor="middle" font-size="23" fill="#eceeeb">Choose an action</text><path d="M305 303 H390" fill="none" stroke="#a4aaa5" stroke-width="2" marker-end="url(#arrow)"/><rect x="410" y="265" width="225" height="77" rx="4" fill="#5fd3e6" fill-opacity=".06" stroke="#5fd3e6" stroke-opacity=".5"/><text x="522" y="312" text-anchor="middle" font-size="23" fill="#eceeeb">Shared control</text><path d="M645 303 H760" fill="none" stroke="#a4aaa5" stroke-width="2" marker-end="url(#arrow)"/><rect x="780" y="265" width="260" height="77" rx="4" fill="#7095db" fill-opacity=".06" stroke="#7095db" stroke-opacity=".5"/><text x="910" y="298" text-anchor="middle" font-size="23" fill="#eceeeb">Virtual / game</text><text x="910" y="323" text-anchor="middle" font-size="18" fill="#eceeeb">environment</text><text x="550" y="382" text-anchor="middle" font-size="23" fill="#eceeeb">Does the outcome still feel like something you caused?</text></g>
</svg>
