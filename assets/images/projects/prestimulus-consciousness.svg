<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-labelledby="title description">
<title id="title">Before the stimulus</title><desc id="description">Activity before a stimulus may be informative about whether it is consciously perceived.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#a4aaa5"/></marker></defs>
<rect width="1100" height="440" rx="3" fill="#10191c"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#eceeeb"><text x="550" y="43" text-anchor="middle" font-size="24" fill="#eceeeb">WHAT HAPPENS BEFORE WE SEE?</text><rect x="55" y="146" width="290" height="112" rx="4" fill="#7095db" fill-opacity=".06" stroke="#7095db" stroke-opacity=".5"/><text x="200" y="185" text-anchor="middle" font-size="23" fill="#eceeeb">Earlier brain activity</text><text x="200" y="219" text-anchor="middle" font-size="18" fill="#a4aaa5">Possible starting states</text><g stroke="#7095db" fill="#7095db" opacity=".6"><path d="M95 238 L139 227 L176 245 L240 231 L295 242" fill="none"/><circle cx="95" cy="238" r="4"/><circle cx="139" cy="227" r="4"/><circle cx="176" cy="245" r="4"/><circle cx="240" cy="231" r="4"/><circle cx="295" cy="242" r="4"/></g><path d="M357 202 H443" fill="none" stroke="#a4aaa5" stroke-width="2" marker-end="url(#arrow)"/><rect x="455" y="157" width="170" height="92" rx="4" fill="#d6dbd7" fill-opacity=".06" stroke="#d6dbd7" stroke-opacity=".5"/><text x="540" y="211" text-anchor="middle" font-size="23" fill="#eceeeb">Stimulus</text><path d="M639 192 Q695 130 750 130" fill="none" stroke="#a4aaa5" stroke-width="2" marker-end="url(#arrow)"/><path d="M639 214 Q695 286 750 286" fill="none" stroke="#a4aaa5" stroke-width="2" marker-end="url(#arrow)"/><rect x="770" y="86" width="280" height="90" rx="4" fill="#67b97a" fill-opacity=".06" stroke="#67b97a" stroke-opacity=".5"/><text x="910" y="125" text-anchor="middle" font-size="23" fill="#eceeeb">Consciously</text><text x="910" y="153" text-anchor="middle" font-size="20" fill="#eceeeb">perceived</text><rect x="770" y="241" width="280" height="90" rx="4" fill="#a4aaa5" fill-opacity=".06" stroke="#a4aaa5" stroke-opacity=".5"/><text x="910" y="280" text-anchor="middle" font-size="23" fill="#eceeeb">Not consciously</text><text x="910" y="308" text-anchor="middle" font-size="20" fill="#eceeeb">perceived</text><text x="550" y="374" text-anchor="middle" font-size="21" fill="#a4aaa5">Comparing report and reduced-report conditions</text></g>
</svg>
